<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Manager · Design options</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    .tnum { font-variant-numeric: tabular-nums; }
    .phone { width: 360px; height: 760px; }
    .caret { display: inline-block; width: 2px; height: 1.05em; transform: translateY(3px); margin-left: 1px; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body class="min-h-screen bg-neutral-200/70 text-neutral-900 antialiased">
  <header class="sticky top-0 z-50 border-b border-neutral-300/60 bg-white/85 backdrop-blur">
    <div class="mx-auto flex max-w-[1600px] flex-wrap items-center justify-between gap-4 px-6 py-4">
      <div>
        <h1 class="text-lg font-semibold">Expense Manager · pick a design</h1>
        <p class="text-sm text-neutral-500">Same app, three visual directions. Screens: trips home · trip detail · add a Common expense · type-to-create label picker.</p>
      </div>
      <nav id="tabs" class="flex gap-1 rounded-full bg-neutral-100 p-1 ring-1 ring-neutral-200"></nav>
    </div>
  </header>
  <main id="stage" class="mx-auto max-w-[1600px] px-6 py-10"></main>

<script>
const inr = n => '₹' + n.toLocaleString('en-IN');
const P = {
  arrowLeft: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  calendar: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  chevronDown: '<path d="m6 9 6 6 6-6"/>',
  userPlus: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/>',
  more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
};
const ic = (name, cls = 'size-5') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[name]}</svg>`;

const trips = [
  { name: 'Goa Getaway', emoji: '🏖️', dates: '24 – 28 Oct', people: 4, spent: 36350, budget: 60000, status: 'Ongoing', tint: 'bg-amber-100' },
  { name: 'Manali Snow Trip', emoji: '🏔️', dates: '3 – 9 Jan', people: 6, spent: 12400, budget: 90000, status: 'Upcoming', tint: 'bg-sky-100' },
  { name: 'Office Offsite', emoji: '💼', dates: '2 – 4 Oct', people: 8, spent: 18900, budget: 15000, status: 'Over budget', tint: 'bg-violet-100' },
];
const people = [
  { name: 'Runal', share: 8550 }, { name: 'Aditi', share: 10250 },
  { name: 'Kabir', share: 8550 }, { name: 'Meera', share: 9000 },
];
const expenses = [
  { title: 'Beach shack dinner', who: 'Common', split: 'All 4', amount: 4800, date: '26 Oct' },
  { title: 'Parasailing', who: 'Aditi', amount: 2500, date: '26 Oct' },
  { title: 'Souvenirs', who: 'Meera', amount: 1250, date: '26 Oct' },
  { title: 'Scooter rental', who: 'Common', split: 'Runal, Kabir', amount: 1600, date: '25 Oct' },
  { title: 'Villa · 4 nights', who: 'Common', split: 'All 4', amount: 24000, date: '24 Oct' },
];
const pct = t => Math.round(t.spent / t.budget * 100);
const sub = e => (e.who === 'Common' ? 'Common · ' + e.split : e.who) + ' · ' + e.date;

const statusBar = cls => `<div class="flex items-center justify-between px-7 pt-4 text-[13px] font-semibold ${cls}"><span>9:41</span><span class="flex items-center gap-1.5"><svg class="h-3 w-4" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg class="h-3 w-6" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="1.5" height="4" rx=".75" fill="currentColor" opacity=".45"/></svg></span></div>`;

const phone = (label, inner) => `
<figure class="flex flex-col items-center gap-4">
  <div class="phone relative rounded-[54px] bg-neutral-950 p-[11px] shadow-2xl shadow-neutral-900/30 ring-1 ring-neutral-800">
    <div class="relative h-full w-full overflow-hidden rounded-[44px]">
      ${inner}
      <div class="pointer-events-none absolute left-1/2 top-2.5 z-50 h-[30px] w-[100px] -translate-x-1/2 rounded-full bg-black"></div>
    </div>
  </div>
  <figcaption class="text-sm font-medium text-neutral-500">${label}</figcaption>
</figure>`;

const ring = (p, id, size = 108, stroke = 10) => {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.min(p, 100) / 100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="-rotate-90"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="${stroke}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
};

/* ---------------- A · Aurora ---------------- */
const A = {
  key: 'A', name: 'Aurora', font: "'Plus Jakarta Sans', sans-serif", fontName: 'Plus Jakarta Sans',
  tagline: 'Dark, glassy fintech look with a violet → cyan glow. Premium and easy on the eyes at night.',
  swatches: ['#070B1A', '#8B5CF6', '#22D3EE', '#F472B6'],
  av: { Runal: 'from-violet-500 to-indigo-500', Aditi: 'from-pink-500 to-rose-500', Kabir: 'from-cyan-400 to-sky-500', Meera: 'from-amber-400 to-orange-500' },
};
const aShell = inner => `<div class="relative h-full bg-[#070B1A] text-white" style="font-family:${A.font}">
  <div class="absolute -left-24 -top-28 size-80 rounded-full bg-violet-600/35 blur-3xl"></div>
  <div class="absolute -right-28 top-64 size-80 rounded-full bg-cyan-500/20 blur-3xl"></div>
  <div class="relative h-full">${statusBar('text-white')}${inner}</div></div>`;
const aAv = (n, s = 'size-10 text-sm', r = 'rounded-2xl') => n === 'Common'
  ? `<div class="grid ${s} ${r} shrink-0 place-items-center bg-linear-to-br from-violet-500/30 to-cyan-400/30 text-cyan-200 ring-1 ring-white/15">${ic('users', 'size-[18px]')}</div>`
  : `<div class="grid ${s} ${r} shrink-0 place-items-center bg-linear-to-br ${A.av[n]} font-bold">${n[0]}</div>`;
const aSheet = content => aShell(`
  <div class="px-5 pt-6 opacity-50"><h2 class="text-[24px] font-bold">🏖️ Goa Getaway</h2><p class="mt-1 text-xs text-slate-400">24 – 28 Oct 2026 · 5 days</p></div>
  <div class="absolute inset-0 bg-black/55"></div>
  <div class="absolute inset-x-0 bottom-0 rounded-t-[32px] border-t border-white/10 bg-[#0D1330]/95 px-5 pb-8 pt-3 backdrop-blur-2xl">
    <div class="mx-auto h-1.5 w-10 rounded-full bg-white/20"></div>
    <div class="mt-4 flex items-center justify-between"><h3 class="text-lg font-bold">New expense</h3><span class="grid size-8 place-items-center rounded-full bg-white/10">${ic('x', 'size-4')}</span></div>
    ${content}
  </div>`);

A.screens = [
  ['Trips home', aShell(`
<div class="px-5">
  <div class="mt-6 flex items-center justify-between">
    <div><p class="text-sm text-slate-400">Good evening,</p><h2 class="text-[26px] font-bold leading-tight">Runal</h2></div>
    <div class="grid size-11 place-items-center rounded-full bg-linear-to-br from-violet-500 to-cyan-400 font-bold ring-2 ring-white/20">R</div>
  </div>
  <div class="mt-5 rounded-[28px] border border-white/10 bg-white/[0.06] p-5 backdrop-blur-xl">
    <p class="text-[11px] font-medium uppercase tracking-[0.18em] text-slate-400">Spent across 3 trips</p>
    <p class="tnum mt-1.5 text-[34px] font-extrabold leading-none">${inr(67650)}</p>
    <div class="mt-4 flex gap-2 text-[11px] font-medium">
      <span class="rounded-full bg-emerald-400/15 px-2.5 py-1 text-emerald-300">2 on track</span>
      <span class="rounded-full bg-rose-400/15 px-2.5 py-1 text-rose-300">1 over budget</span>
    </div>
  </div>
  <div class="mt-7 flex items-center justify-between"><h3 class="font-semibold">Your trips</h3><span class="text-xs text-slate-400">3 total</span></div>
  ${trips.map(t => { const p = pct(t), over = p > 100; return `
  <div class="mt-3 rounded-[24px] border border-white/10 bg-white/[0.05] p-4 backdrop-blur-xl">
    <div class="flex items-center gap-3">
      <div class="grid size-12 place-items-center rounded-2xl bg-white/10 text-2xl">${t.emoji}</div>
      <div class="min-w-0 flex-1"><p class="font-semibold">${t.name}</p><p class="text-xs text-slate-400">${t.dates} · ${t.people} people</p></div>
      <span class="rounded-full px-2.5 py-1 text-[11px] font-medium ${over ? 'bg-rose-400/15 text-rose-300' : t.status === 'Ongoing' ? 'bg-cyan-400/15 text-cyan-300' : 'bg-white/10 text-slate-300'}">${t.status}</span>
    </div>
    <div class="mt-4 flex items-end justify-between"><span class="tnum text-sm font-semibold">${inr(t.spent)}</span><span class="tnum text-xs text-slate-400">of ${inr(t.budget)}</span></div>
    <div class="mt-2 h-2 overflow-hidden rounded-full bg-white/10"><div class="h-full rounded-full bg-linear-to-r ${over ? 'from-rose-500 to-orange-400' : 'from-violet-500 to-cyan-400'}" style="width:${Math.min(p, 100)}%"></div></div>
  </div>`; }).join('')}
</div>
<button class="absolute bottom-8 right-5 flex items-center gap-2 rounded-full bg-linear-to-r from-violet-500 to-cyan-400 px-5 py-3.5 text-sm font-semibold shadow-lg shadow-violet-500/40">${ic('plus', 'size-4')} New trip</button>`)],

  ['Trip detail + budget', aShell(`
<div class="px-5">
  <div class="mt-4 flex items-center justify-between">
    <span class="grid size-10 place-items-center rounded-full border border-white/10 bg-white/5">${ic('arrowLeft', 'size-[18px]')}</span>
    <div class="flex gap-2">
      <span class="flex items-center gap-1.5 rounded-full border border-white/10 bg-white/5 px-3.5 py-2 text-xs font-semibold">${ic('download', 'size-4')} PDF</span>
      <span class="grid size-10 place-items-center rounded-full border border-white/10 bg-white/5">${ic('more', 'size-[18px]')}</span>
    </div>
  </div>
  <h2 class="mt-4 text-[24px] font-bold">🏖️ Goa Getaway</h2>
  <p class="mt-1 flex items-center gap-1.5 text-xs text-slate-400">${ic('calendar', 'size-3.5')} 24 – 28 Oct 2026 · 5 days · Day 3</p>
  <div class="mt-4 flex items-center gap-4 rounded-[28px] border border-white/10 bg-white/[0.06] p-4 backdrop-blur-xl">
    <div class="relative">${ring(61, 'ringA')}<div class="absolute inset-0 grid place-items-center text-center"><div><p class="text-xl font-extrabold leading-none">61%</p><p class="mt-1 text-[10px] uppercase tracking-wider text-slate-400">used</p></div></div></div>
    <div class="flex-1 space-y-2.5">
      <div><p class="text-[11px] text-slate-400">Spent</p><p class="tnum text-lg font-bold leading-tight">${inr(36350)}</p></div>
      <div class="flex gap-4">
        <div><p class="text-[11px] text-slate-400">Left</p><p class="tnum text-sm font-semibold text-emerald-300">${inr(23650)}</p></div>
        <div><p class="text-[11px] text-slate-400">Per day</p><p class="tnum text-sm font-semibold">${inr(7883)}</p></div>
      </div>
      <p class="tnum text-[11px] text-slate-500">Budget ${inr(60000)}</p>
    </div>
  </div>
  <div class="mt-5 flex items-center justify-between"><h3 class="text-sm font-semibold">Each person's share</h3><span class="text-xs text-slate-400">4 people</span></div>
  <div class="mt-2.5 flex gap-2.5 overflow-hidden">
    ${people.map(p => `<div class="w-[92px] shrink-0 rounded-2xl border border-white/10 bg-white/[0.05] p-3">${aAv(p.name, 'size-8 text-xs', 'rounded-xl')}<p class="mt-2 text-xs text-slate-300">${p.name}</p><p class="tnum text-sm font-bold">${inr(p.share)}</p></div>`).join('')}
  </div>
  <div class="mt-5 flex rounded-full border border-white/10 bg-white/5 p-1 text-xs font-semibold">
    <span class="flex-1 rounded-full bg-white/10 py-2 text-center">Expenses</span><span class="flex-1 py-2 text-center text-slate-400">Split</span>
  </div>
  <div class="mt-1">
    ${expenses.slice(0, 4).map(e => `<div class="flex items-center gap-3 border-b border-white/5 py-3">${aAv(e.who)}<div class="min-w-0 flex-1"><p class="truncate text-sm font-semibold">${e.title}</p><p class="text-xs text-slate-400">${sub(e)}</p></div><p class="tnum text-sm font-bold">${inr(e.amount)}</p></div>`).join('')}
  </div>
</div>
<div class="absolute inset-x-0 bottom-0 h-28 bg-linear-to-t from-[#070B1A] to-transparent"></div>
<span class="absolute bottom-7 left-1/2 flex -translate-x-1/2 items-center gap-2 rounded-full bg-linear-to-r from-violet-500 to-cyan-400 px-6 py-3.5 text-sm font-semibold shadow-lg shadow-violet-500/40">${ic('plus', 'size-4')} Add expense</span>`)],

  ['Add expense · Common split', aSheet(`
<div class="mt-5 text-center"><p class="text-[11px] uppercase tracking-[0.2em] text-slate-400">Amount</p><p class="tnum mt-1 text-[44px] font-extrabold leading-none"><span class="text-slate-500">₹</span>2,000</p></div>
<div class="mt-6 space-y-3">
  <div class="rounded-2xl border border-white/10 bg-white/5 px-4 py-3"><p class="text-[11px] text-slate-400">What was it?</p><p class="text-sm font-medium">Sunset kayaking</p></div>
  <div class="flex gap-3">
    <div class="flex-1 rounded-2xl border border-violet-400/50 bg-violet-500/10 px-4 py-3"><p class="text-[11px] text-slate-400">For</p><p class="flex items-center gap-1.5 text-sm font-semibold">${ic('users', 'size-4 text-cyan-300')} Common <span class="ml-auto text-slate-400">${ic('chevronDown', 'size-4')}</span></p></div>
    <div class="w-[116px] rounded-2xl border border-white/10 bg-white/5 px-4 py-3"><p class="text-[11px] text-slate-400">Date</p><p class="text-sm font-medium">26 Oct</p></div>
  </div>
</div>
<div class="mt-5">
  <div class="flex items-center justify-between"><p class="text-sm font-semibold">Split between</p><p class="tnum text-xs text-cyan-300">${inr(500)} each · 4 people</p></div>
  <div class="mt-3 flex flex-wrap gap-2">
    <span class="flex items-center gap-1.5 rounded-full bg-linear-to-r from-violet-500 to-cyan-400 px-3.5 py-2 text-xs font-semibold">${ic('check', 'size-3.5')} All</span>
    ${people.map(p => `<span class="flex items-center gap-2 rounded-full border border-violet-400/40 bg-violet-500/15 py-1 pl-1 pr-3 text-xs font-semibold">${aAv(p.name, 'size-6 text-[10px]', 'rounded-full')}${p.name}</span>`).join('')}
  </div>
</div>
<button class="mt-7 w-full rounded-2xl bg-linear-to-r from-violet-500 to-cyan-400 py-4 text-sm font-bold shadow-lg shadow-violet-500/30">Add expense · ${inr(2000)}</button>`)],

  ['Label picker · type to create', aSheet(`
<div class="mt-5 rounded-2xl border border-white/10 bg-white/5 px-4 py-3 opacity-60"><p class="text-[11px] text-slate-400">What was it?</p><p class="text-sm font-medium">Kite surfing lesson</p></div>
<div class="mt-3 rounded-2xl border border-cyan-300/60 bg-white/[0.07] px-4 py-3 ring-4 ring-cyan-400/10"><p class="text-[11px] text-slate-400">For</p><p class="text-sm font-medium">Ishaan<span class="caret bg-cyan-300"></span></p></div>
<div class="mt-2 overflow-hidden rounded-2xl border border-white/10 bg-[#141B3D] p-1.5 shadow-2xl shadow-black/50">
  <div class="flex items-center gap-3 rounded-xl px-2.5 py-2">${aAv('Common', 'size-9', 'rounded-xl')}<div class="flex-1"><p class="text-sm font-semibold">Common</p><p class="text-[11px] text-slate-400">Split between people</p></div></div>
  <p class="px-2.5 pt-2 text-[10px] font-semibold uppercase tracking-widest text-slate-500">Labels</p>
  <p class="px-2.5 py-1.5 text-xs text-slate-400">No label matches “Ishaan”</p>
  <div class="flex items-center gap-3 rounded-xl bg-linear-to-r from-violet-500/25 to-cyan-400/20 px-2.5 py-2.5 ring-1 ring-cyan-300/30">
    <div class="grid size-9 place-items-center rounded-xl bg-linear-to-br from-violet-500 to-cyan-400">${ic('userPlus', 'size-[18px]')}</div>
    <div class="flex-1"><p class="text-sm font-semibold">Create “Ishaan”</p><p class="text-[11px] text-slate-300">Adds a new label to this trip</p></div>
    <kbd class="rounded-md bg-white/10 px-1.5 py-0.5 text-[10px] text-slate-300">↵</kbd>
  </div>
</div>
<p class="mt-4 text-center text-[11px] text-slate-500">Existing labels: Runal · Aditi · Kabir · Meera</p>
<button class="mt-4 w-full rounded-2xl bg-white/10 py-4 text-sm font-bold text-slate-400">Add expense</button>`)],
];

/* ---------------- B · Paper ---------------- */
const B = {
  key: 'B', name: 'Paper', font: 'Inter, sans-serif', fontName: 'Inter',
  tagline: 'Light, calm and minimal. Big numbers, hairline borders, one green accent. iOS-style forms.',
  swatches: ['#F6F5F1', '#FFFFFF', '#18181B', '#059669'],
  av: { Runal: 'bg-emerald-100 text-emerald-800', Aditi: 'bg-rose-100 text-rose-800', Kabir: 'bg-sky-100 text-sky-800', Meera: 'bg-amber-100 text-amber-800' },
};
const bShell = inner => `<div class="relative h-full bg-[#F6F5F1] text-zinc-900" style="font-family:${B.font}">${statusBar('text-zinc-900')}${inner}</div>`;
const bAv = (n, s = 'size-10 text-sm') => n === 'Common'
  ? `<div class="grid ${s} shrink-0 place-items-center rounded-full bg-zinc-900 text-white">${ic('users', 'size-[55%]')}</div>`
  : `<div class="grid ${s} shrink-0 place-items-center rounded-full ${B.av[n]} font-semibold">${n[0]}</div>`;
const bRow = e => `<div class="flex items-center gap-3 px-4 py-3">${bAv(e.who)}<div class="min-w-0 flex-1"><p class="truncate text-sm font-medium">${e.title}</p><p class="text-xs text-zinc-500">${e.who === 'Common' ? 'Common · ' + e.split : e.who}</p></div><p class="tnum text-sm font-semibold">${inr(e.amount)}</p></div>`;
const bSheet = content => bShell(`
  <div class="absolute inset-0 bg-zinc-900/20"></div>
  <div class="absolute inset-x-0 bottom-0 top-12 rounded-t-[28px] bg-[#F6F5F1] shadow-[0_-8px_30px_rgba(0,0,0,.08)]">
    <div class="mx-auto mt-2 h-1.5 w-10 rounded-full bg-zinc-300"></div>
    <div class="flex items-center justify-between px-5 pt-3 text-sm"><span class="text-zinc-500">Cancel</span><span class="font-semibold">New expense</span><span class="font-semibold text-emerald-700">Save</span></div>
    ${content}
  </div>`);

B.screens = [
  ['Trips home', bShell(`
<div class="px-5">
  <div class="mt-7 flex items-center justify-between">
    <h2 class="text-[32px] font-semibold tracking-tight">Trips</h2>
    <div class="grid size-10 place-items-center rounded-full bg-zinc-900 text-sm font-semibold text-white">R</div>
  </div>
  <p class="tnum text-sm text-zinc-500">3 trips · ${inr(67650)} spent in total</p>
  <div class="mt-6 space-y-3">
  ${trips.map(t => { const p = pct(t), over = p > 100; return `
    <div class="rounded-2xl border border-zinc-200 bg-white p-4 shadow-[0_1px_2px_rgba(0,0,0,.04)]">
      <div class="flex items-center gap-3">
